<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; width: 280px; padding: 12px; background: #14161a; color: #e8e8e8; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; font-size: 11px; color: #9aa0a6; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-bottom: 10px;
          background: #1e2126; border: 1px solid #3a3f47; border-radius: 4px; color: #e8e8e8; font-size: 12px; }
  button { width: 100%; padding: 7px; border: none; border-radius: 4px; background: #4f8ef7;
           color: #fff; font-size: 12px; cursor: pointer; margin-bottom: 6px; }
  button:hover { background: #3f7ee0; }
  #status { font-size: 11px; margin-top: 6px; min-height: 14px; }
  .ok { color: #4caf7c; }
  .err { color: #e0645a; }
</style>
</head>
<body>
  <h1>Meshory Importer</h1>
  <label for="serverUrl">Meshory server URL</label>
  <input id="serverUrl" placeholder="http://192.168.1.50:8420">
  <label for="apiKey">Extension API key <span style="color:#9aa0a6">(Settings tab in Meshory)</span></label>
  <input id="apiKey" placeholder="paste key from Meshory Settings">
  <button id="save">Save</button>
  <button id="test">Test Connection</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
